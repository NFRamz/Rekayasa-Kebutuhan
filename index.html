<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Drive Book Reader</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
body { margin:0; text-align:center; background:#222; }
canvas { margin:10px auto; display:block; }
#topbar{
position:fixed;
top:0;
width:100%;
background:#111;
color:white;
padding:10px;
font-size:18px;
}
</style>
</head>

<body>

<div id="topbar">Halaman: <span id="page_num"></span></div>
<canvas id="pdf-render"></canvas>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const params = new URLSearchParams(window.location.search);
const fileId = params.get("file");

if(!fileId){
document.body.innerHTML="<h2>Tambahkan ?file=ID_DRIVE</h2>";
throw "No file id";
}

// PENTING: pakai gview proxy
const pdfUrl =
"https://docs.google.com/gview?embedded=1&url=" +
encodeURIComponent("https://drive.google.com/uc?export=download&id="+fileId);

let pdfDoc=null;
let pageNum=parseInt(localStorage.getItem(fileId))||1;
const canvas=document.getElementById("pdf-render");
const ctx=canvas.getContext("2d");

async function loadPdf(){
const loadingTask = pdfjsLib.getDocument({
url: "https://drive.google.com/uc?export=download&id="+fileId,
withCredentials:false
});

pdfDoc = await loadingTask.promise;
renderPage(pageNum);
}

function renderPage(num){

if(num<1) num=1;
if(num>pdfDoc.numPages) num=pdfDoc.numPages;

pageNum=num;

pdfDoc.getPage(num).then(page=>{
const viewport=page.getViewport({scale:1.5});

canvas.height=viewport.height;
canvas.width=viewport.width;

page.render({
canvasContext:ctx,
viewport:viewport
});

document.getElementById("page_num").textContent=num;

// simpan halaman terakhir
localStorage.setItem(fileId,num);
});
}

window.addEventListener("keydown",e=>{
if(e.key==="ArrowRight"){renderPage(pageNum+1);}
if(e.key==="ArrowLeft"){renderPage(pageNum-1);}
});

loadPdf();
</script>

</body>
</html>
