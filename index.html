<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive PDF Viewer dengan Bookmark</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { height: 100%; margin: 0; overflow: hidden; }
        #app-container { display: flex; flex-direction: column; height: 100vh; }
        #iframe-container { flex-grow: 1; width: 100%; border: none; background-color: #f3f4f6; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <div id="app-container">
        <!-- Toolbar Atas -->
        <div class="bg-white border-b shadow-sm p-3 flex flex-col md:flex-row items-center justify-between gap-4 z-10">
            
            <div class="flex items-center gap-2 w-full md:w-auto">
                <div class="bg-blue-600 text-white p-2 rounded-lg font-bold">PDF</div>
                <div class="flex-1">
                    <input type="text" id="file-id" placeholder="ID File Google Drive" 
                        class="w-full md:w-64 px-3 py-1.5 border border-gray-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                        value="1ewNhvYGoxFjso9puvNEKWY0a41lAOUaZ">
                </div>
                <button id="load-btn" class="bg-blue-100 hover:bg-blue-200 text-blue-700 px-4 py-1.5 rounded text-sm font-semibold transition">
                    Muat
                </button>
            </div>

            <!-- Kontrol Halaman (Penyimpanan Manual) -->
            <div class="flex items-center gap-3 bg-yellow-50 border border-yellow-200 px-4 py-2 rounded-lg w-full md:w-auto">
                <div class="text-sm">
                    <span class="text-yellow-800 font-medium">Terakhir dibaca: Halaman</span>
                </div>
                <input type="number" id="page-input" placeholder="1" min="1"
                    class="w-20 px-2 py-1 border border-gray-300 rounded text-center font-bold text-blue-600 focus:outline-none focus:ring-2 focus:ring-yellow-400">
                <button id="save-btn" class="bg-yellow-400 hover:bg-yellow-500 text-yellow-900 px-3 py-1 rounded text-sm font-bold shadow-sm transition">
                    Simpan Posisi
                </button>
            </div>

        </div>

        <!-- Peringatan Keamanan Iframe -->
        <div id="info-bar" class="bg-blue-50 text-blue-800 text-xs text-center py-1 border-b border-blue-100">
            Karena aturan keamanan browser, kami tidak bisa melacak halaman di dalam Google Drive secara otomatis. <b>Harap ketik dan simpan halaman terakhir Anda di kotak kuning di atas sebelum menutup tab.</b>
        </div>

        <!-- Area Tampilan Google Drive -->
        <div id="iframe-container">
            <iframe id="drive-iframe" allow="autoplay" title="Google Drive Viewer"></iframe>
        </div>
    </div>

    <script>
        const fileIdInput = document.getElementById('file-id');
        const pageInput = document.getElementById('page-input');
        const loadBtn = document.getElementById('load-btn');
        const saveBtn = document.getElementById('save-btn');
        const driveIframe = document.getElementById('drive-iframe');
        const infoBar = document.getElementById('info-bar');

        // Fungsi untuk memuat Iframe Google Drive
        function loadDriveViewer() {
            const fileId = fileIdInput.value.trim();
            if (!fileId) return;

            // Memuat file dari LocalStorage jika ada
            const savedPage = localStorage.getItem(`bookmark_drive_${fileId}`);
            
            if (savedPage) {
                pageInput.value = savedPage;
                // Meskipun Google Drive jarang merespon parameter #page= pada iframe preview,
                // kita tetap menyertakannya sebagai standar.
                driveIframe.src = `https://drive.google.com/file/d/${fileId}/preview#page=${savedPage}`;
                
                // Ubah info bar untuk memberitahu pengguna
                infoBar.innerHTML = `File dimuat! Anda terakhir berada di <b>Halaman ${savedPage}</b>. Silakan scroll ke halaman tersebut.`;
                infoBar.className = "bg-green-50 text-green-800 text-xs text-center py-1 border-b border-green-100";
            } else {
                pageInput.value = '';
                driveIframe.src = `https://drive.google.com/file/d/${fileId}/preview`;
                infoBar.innerHTML = `Karena aturan keamanan browser, harap ketik dan simpan halaman terakhir Anda di kotak kuning sebelum menutup tab.`;
                infoBar.className = "bg-blue-50 text-blue-800 text-xs text-center py-1 border-b border-blue-100";
            }
        }

        // Fungsi untuk menyimpan posisi halaman
        function savePagePosition() {
            const fileId = fileIdInput.value.trim();
            const pageNum = pageInput.value.trim();
            
            if (!fileId) {
                alert("Harap masukkan ID File terlebih dahulu.");
                return;
            }

            if (!pageNum || isNaN(pageNum)) {
                alert("Harap masukkan angka halaman yang valid.");
                return;
            }

            localStorage.setItem(`bookmark_drive_${fileId}`, pageNum);
            
            // Ubah tombol jadi indikator sukses sesaat
            const originalText = saveBtn.innerText;
            saveBtn.innerText = "Tersimpan! ✔";
            saveBtn.classList.replace('bg-yellow-400', 'bg-green-400');
            saveBtn.classList.replace('text-yellow-900', 'text-green-900');
            
            setTimeout(() => {
                saveBtn.innerText = originalText;
                saveBtn.classList.replace('bg-green-400', 'bg-yellow-400');
                saveBtn.classList.replace('text-green-900', 'text-yellow-900');
            }, 2000);
        }

        // Event Listeners
        loadBtn.addEventListener('click', loadDriveViewer);
        saveBtn.addEventListener('click', savePagePosition);
        
        // Enter di input ID memuat file
        fileIdInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loadDriveViewer();
        });

        // Enter di input Halaman langsung menyimpan
        pageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') savePagePosition();
        });

        // Muat otomatis saat pertama kali dibuka
        window.onload = loadDriveViewer;

    </script>
</body>
</html>
